name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Type-check Cloudflare Pages API
        run: npx tsc --ignoreConfig --noEmit --target ES2022 --lib ES2022,DOM --skipLibCheck --module ESNext --moduleResolution Bundler 'functions/api/[[path]].ts'
