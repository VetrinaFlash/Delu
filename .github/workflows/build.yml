name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Type-check Cloudflare Pages API
        run: npx tsc --ignoreConfig --noEmit --target ES2022 --lib ES2022,DOM --skipLibCheck --module ESNext --moduleResolution Bundler 'functions/api/[[path]].ts'
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: Browser QA — desktop and mobile
        run: npm run test:e2e
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-qa-${{ github.sha }}
          path: |
            playwright-report
            test-results
          retention-days: 7
